name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Unit tests + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # flavor 化后 profile 必须放在 src/<flavor><BuildType>/generated/baselineProfiles/，
      # 放在 src/release/ 不会参与合并（曾导致 Release 无 App 级 profile 且无人发现）。
      # full/lite 依赖不同（lite 无游戏模块），profile 本就应当不同，不做字节一致断言；
      # 只校验各自存在且包含足量行/自有 app 类，防止空文件或占位文件混过 CI。
      - name: Verify flavor baseline profiles present
        run: |
          for profile in \
            app/src/fullRelease/generated/baselineProfiles/baseline-prof.txt \
            app/src/liteRelease/generated/baselineProfiles/baseline-prof.txt
          do
            [ -f "$profile" ] || { echo "missing baseline profile: $profile"; exit 1; }
            lines=$(wc -l < "$profile" | tr -d ' ')
            if [ "$lines" -lt 100 ]; then
              echo "baseline profile too small: $profile ($lines lines)"; exit 1
            fi
            app_entries=$(grep -c 'com/xiaoxiong' "$profile" || true)
            if [ "$app_entries" -lt 200 ]; then
              echo "baseline profile too few app classes: $profile ($app_entries entries)"; exit 1
            fi
            echo "baseline profile OK: $profile ($lines lines, $app_entries app entries)"
          done

      - name: ktlint
        run: ./gradlew lintKotlin

      - name: Unit tests (all modules)
        run: ./gradlew test --stacktrace

      - name: Lint (full debug)
        run: ./gradlew lintFullDebug

      # CI 只验证 release 构建产物，用一次性密钥满足 signingConfig；
      # 真实发布密钥仅在 release.yml 从 secrets 注入，仓库内不落盘任何真实密钥
      - name: Generate CI signing key
        run: |
          keytool -genkeypair -v -keystore ci.keystore -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI, O=XiaoxiongWeather"
          printf 'storeFile=ci.keystore\nstorePassword=android\nkeyAlias=ci\nkeyPassword=android\n' > keystore.properties

      - name: Build release (full, R8 + shrinkResources)
        run: ./gradlew :app:assembleFullRelease

      # lite 版依赖裁剪（零游戏依赖）容易在无人构建时被破坏，CI 与 full 同环境构建
      - name: Build release (lite, R8 + shrinkResources)
        run: ./gradlew :app:assembleLiteRelease

      - name: Verify game ServiceLoader registrations survive R8
        run: |
          unzip -p app/build/outputs/apk/full/release/app-full-release.apk \
            META-INF/services/com.xiaoxiong.weather.game.GameEntryProvider \
            > /tmp/game_providers.txt
          for provider in \
            com.xiaoxiong.weather.ui.game.BearGameEntryProvider \
            com.xiaoxiong.weather.ui.game.BearStarJumpEntryProvider \
            com.xiaoxiong.weather.ui.game.BearMazeEntryProvider \
            com.xiaoxiong.weather.ui.game.BearFarmEntryProvider \
            com.xiaoxiong.weather.ui.game.BearHomeEntryProvider \
            com.xiaoxiong.weather.ui.game.BearCatchEntryProvider \
            com.xiaoxiong.weather.ui.game.BearHockeyEntryProvider \
            com.xiaoxiong.weather.ui.game.BearPoolEntryProvider
          do
            grep -qx "$provider" /tmp/game_providers.txt \
              || { echo "ServiceLoader registration missing: $provider"; exit 1; }
          done

      # R8 后 provider 类与 <init>() 必须在 dex 中真实存在，否则运行期抛
      # ServiceConfigurationError（见 1.6.5 闪退）。dexdump 来自 build-tools。
      - name: Verify provider constructors survive R8 in dex
        run: |
          DEXDUMP=$(find "$ANDROID_HOME/build-tools" -name dexdump | sort -V | tail -1)
          [ -n "$DEXDUMP" ] || { echo "dexdump not found"; exit 1; }
          rm -rf /tmp/apk_dex && mkdir -p /tmp/apk_dex
          unzip -q app/build/outputs/apk/full/release/app-full-release.apk \
            'classes*.dex' -d /tmp/apk_dex
          found=0
          for provider in \
            com.xiaoxiong.weather.ui.game.BearGameEntryProvider \
            com.xiaoxiong.weather.ui.game.BearStarJumpEntryProvider \
            com.xiaoxiong.weather.ui.game.BearMazeEntryProvider \
            com.xiaoxiong.weather.ui.game.BearFarmEntryProvider \
            com.xiaoxiong.weather.ui.game.BearHomeEntryProvider \
            com.xiaoxiong.weather.ui.game.BearCatchEntryProvider \
            com.xiaoxiong.weather.ui.game.BearHockeyEntryProvider \
            com.xiaoxiong.weather.ui.game.BearPoolEntryProvider
          do
            # 全限定名转 dex 内部描述符：com.a.B -> Lcom/a/B;
            cls="L$(echo "$provider" | tr '.' '/');"
            class_ok=0
            for dex in /tmp/apk_dex/classes*.dex; do
              if "$DEXDUMP" "$dex" 2>/dev/null | grep -q "$cls" \
                  && "$DEXDUMP" "$dex" 2>/dev/null | grep -A8 "$cls" | grep -q "<init>"; then
                class_ok=1
                break
              fi
            done
            if [ "$class_ok" -ne 1 ]; then
              echo "Provider class or <init> missing in dex: $provider"; exit 1
            fi
            found=$((found + 1))
          done
          echo "Verified $found provider constructors in dex"

      - name: Build release (full, games=none)
        run: ./gradlew :app:assembleFullRelease -Pgames=none

      - name: Verify games=none APK has no game registrations
        run: |
          COUNT=$(unzip -p app/build/outputs/apk/full/release/app-full-release.apk \
            META-INF/services/com.xiaoxiong.weather.game.GameEntryProvider 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" != "0" ]; then
            echo "games=none APK should have no GameEntryProvider registrations, found $COUNT"
            exit 1
          fi
          echo "games=none APK is clean (0 registrations)"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            core/**/build/test-results/
            feature/**/build/test-results/
            game/**/build/test-results/
