name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build APK & publish release
    runs-on: ubuntu-latest
    # 冷缓存下 test + lintKotlin + R8 + 签名 APK 全量构建，60 分钟留出足够余量
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要历史 tag 才能校验 versionCode 相对上一版递增
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # tag / versionName / CHANGELOG 三处不一致时直接失败，避免发出错误版本
      - name: Verify version consistency
        run: python3 tools/verify_release_version.py "$GITHUB_REF_NAME"

      # 签名材料只从 secrets 注入，仓库内不落盘任何密钥
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret 未配置，请在仓库 Settings→Secrets 中添加"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > keystore.properties

      # Crashlytics 可选：有 GOOGLE_SERVICES_JSON secret（base64 或原始 JSON 均可）时
      # 写为 app/google-services.json，Gradle 会自动启用 Firebase 插件；没有则 warning 后继续
      - name: Restore Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret 未配置，本次发布包不含 Crashlytics 上报"
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json 2>/dev/null; then
            echo "Firebase config restored (base64)"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config restored (plain JSON)"
          fi

      # 发布前必须通过单元测试与 ktlint，失败即中止，不产出 Release；
      # 与 release.sh 的默认校验一致（release.sh 可用 SKIP_TESTS=1 跳过）
      - name: Unit tests + ktlint
        run: ./gradlew test lintKotlin --console=plain

      # tag push 不触发 ci.yml，这里补一次资源重名检查（静默覆盖会在发布包才暴露）
      - name: Check duplicate game string resources
        run: python3 tools/check_duplicate_game_strings.py

      - name: Build full release APK
        run: ./gradlew assembleFullRelease --stacktrace

      # 发布产物自身再过一遍 R8 keep 校验（@Serializable $$serializer / provider /
      # Worker / 持久化枚举 / Firebase 反射面），避免 CI 未跑或 secret 差异导致漏保
      - name: Verify R8 keep coverage in dex (serializers / reflection)
        run: python3 tools/check_r8_dex_keep.py

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          NOTES=$(awk -v ver="[$VERSION]" '
            BEGIN { RS = "\n## " }
            index($0, ver) == 1 {
              sub(/^\[[0-9.]+\] - [0-9-]+[[:space:]]*/, "")
              print; exit
            }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "$NOTES" > /tmp/release-notes.txt
          fi

      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.tag }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret 未配置（需要有 xiaoxiong-weather-releases 写权限的 PAT）"
            exit 1
          fi
          APK=app/build/outputs/apk/full/release/app-full-release.apk
          REPO=zhangruyangm-creator/xiaoxiong-weather-releases
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # 本地 release.sh 已创建同名 Release：覆盖上传 APK，避免 tag 触发 CI 时因重名失败
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          elif [ "$HAS_NOTES" == "true" ]; then
            gh release create "$TAG" \
              "$APK" \
              --repo "$REPO" \
              --title "Xiaoxiong Weather $VERSION" \
              --notes-file /tmp/release-notes.txt
          else
            gh release create "$TAG" \
              "$APK" \
              --repo "$REPO" \
              --title "Xiaoxiong Weather $VERSION" \
              --notes "自动发布：v$VERSION（由 GitHub Actions 构建签名）" \
              --generate-notes
          fi

      - name: Update downloads README
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_TOKEN 未配置，跳过下载站 README 更新"
            exit 0
          fi
          python3 tools/update_releases_readme.py "$GH_TOKEN" "$VERSION" app/build/outputs/apk/full/release/app-full-release.apk
