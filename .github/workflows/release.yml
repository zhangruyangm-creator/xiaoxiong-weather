name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build APK & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 签名材料只从 secrets 注入，仓库内不落盘任何密钥
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret 未配置，请在仓库 Settings→Secrets 中添加"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > keystore.properties

      - name: Build full release APK
        run: ./gradlew assembleFullRelease --stacktrace

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          NOTES=$(awk -v ver="[$VERSION]" '
            BEGIN { RS = "\n## " }
            index($0, ver) == 1 {
              sub(/^\[[0-9.]+\] - [0-9-]+[[:space:]]*/, "")
              print; exit
            }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "$NOTES" > /tmp/release-notes.txt
          fi

      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.tag }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret 未配置（需要有 xiaoxiong-weather-releases 写权限的 PAT）"
            exit 1
          fi
          if [ "$HAS_NOTES" == "true" ]; then
            gh release create "$TAG" \
              app/build/outputs/apk/full/release/app-full-release.apk \
              --repo zhangruyangm-creator/xiaoxiong-weather-releases \
              --title "Xiaoxiong Weather $VERSION" \
              --notes-file /tmp/release-notes.txt
          else
            gh release create "$TAG" \
              app/build/outputs/apk/full/release/app-full-release.apk \
              --repo zhangruyangm-creator/xiaoxiong-weather-releases \
              --title "Xiaoxiong Weather $VERSION" \
              --notes "自动发布：v$VERSION（由 GitHub Actions 构建签名）" \
              --generate-notes
          fi
